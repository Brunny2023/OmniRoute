name: Cloudflare staging

on:
  push:
    branches:
      - cloudflare-staging
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-staging
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy staging gateway
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: staging
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm

      - name: Cloudflare authorization preflight
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${CLOUDFLARE_API_TOKEN:-}" || -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]]; then
            echo "::error::Cloudflare preflight requires both configured Cloudflare credentials."
            exit 1
          fi

          preflight_dir="${RUNNER_TEMP}/cloudflare-auth-preflight"
          umask 077
          mkdir -p "${preflight_dir}"
          chmod 700 "${preflight_dir}"
          curl_config="${preflight_dir}/curl.conf"
          trap 'rm -rf -- "${preflight_dir}"' EXIT
          printf 'header = "Authorization: Bearer %s"\n' "${CLOUDFLARE_API_TOKEN}" > "${curl_config}"
          printf 'header = "Accept: application/json"\n' >> "${curl_config}"
          chmod 600 "${curl_config}"

          cloudflare_get() {
            local endpoint="$1"
            local response_file="$2"
            local http_status
            if ! http_status="$(curl --config "${curl_config}" --silent --show-error --output "${response_file}" --write-out '%{http_code}' "https://api.cloudflare.com/client/v4${endpoint}")"; then
              echo "::error::Cloudflare preflight transport failure for ${endpoint}."
              exit 1
            fi
            if [[ "${http_status}" != 2* ]]; then
              echo "::error::Cloudflare preflight request failed for ${endpoint} with HTTP ${http_status}."
              exit 1
            fi
          }

          token_response="${preflight_dir}/token-verify.json"
          cloudflare_get "/user/tokens/verify" "${token_response}"
          token_status="$(node -e 'const fs=require("fs"); const value=JSON.parse(fs.readFileSync(process.argv[1], "utf8")); process.stdout.write(typeof value?.result?.status === "string" ? value.result.status : "unknown");' "${token_response}")"
          if [[ "${token_status}" != "active" ]]; then
            echo "::error::Cloudflare API token verification did not report an active token."
            exit 1
          fi

          account_response="${preflight_dir}/account-workers.json"
          cloudflare_get "/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts?per_page=1" "${account_response}"
          account_success="$(node -e 'const fs=require("fs"); const value=JSON.parse(fs.readFileSync(process.argv[1], "utf8")); process.stdout.write(value?.success === true ? "true" : "false");' "${account_response}")"
          if [[ "${account_success}" != "true" ]]; then
            echo "::error::Configured Cloudflare account could not be read with the supplied credentials."
            exit 1
          fi

          containers_response="${preflight_dir}/containers-applications.json"
          cloudflare_get "/accounts/${CLOUDFLARE_ACCOUNT_ID}/containers/applications?per_page=1" "${containers_response}"
          containers_success="$(node -e 'const fs=require("fs"); const value=JSON.parse(fs.readFileSync(process.argv[1], "utf8")); process.stdout.write(value?.success === true ? "true" : "false");' "${containers_response}")"
          if [[ "${containers_success}" != "true" ]]; then
            echo "::error::Cloudflare Workers Containers read preflight failed for the configured account."
            exit 1
          fi

          echo "Cloudflare token verification: PASS (active)."
          echo "Cloudflare configured-account access: PASS."
          echo "Workers Scripts read preflight: PASS; no write operation was attempted."
          echo "Workers Containers read preflight: PASS; no write operation was attempted."
          echo "Durable Object migration permission: not mutation-tested; deployment remains separately authorized."

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Install deployment dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Validate Worker configuration
        run: npx wrangler deploy --config wrangler.jsonc --dry-run

      - name: Create temporary staging Worker secrets file
        shell: bash
        env:
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          API_KEY_SECRET: ${{ secrets.API_KEY_SECRET }}
          INITIAL_PASSWORD: ${{ secrets.INITIAL_PASSWORD }}
          STORAGE_ENCRYPTION_KEY: ${{ secrets.STORAGE_ENCRYPTION_KEY }}
          OMNIROUTE_WS_BRIDGE_SECRET: ${{ secrets.OMNIROUTE_WS_BRIDGE_SECRET }}
        run: |
          set -euo pipefail
          for secret_name in JWT_SECRET API_KEY_SECRET INITIAL_PASSWORD STORAGE_ENCRYPTION_KEY OMNIROUTE_WS_BRIDGE_SECRET; do
            if [[ -z "${!secret_name:-}" ]]; then
              echo "::error::Required staging deployment secret ${secret_name} is unavailable."
              exit 1
            fi
          done

          secrets_file="${RUNNER_TEMP}/omniroute-staging-worker-secrets.env"
          umask 077
          : > "${secrets_file}"
          printf 'JWT_SECRET=%s\n' "${JWT_SECRET}" >> "${secrets_file}"
          printf 'API_KEY_SECRET=%s\n' "${API_KEY_SECRET}" >> "${secrets_file}"
          printf 'INITIAL_PASSWORD=%s\n' "${INITIAL_PASSWORD}" >> "${secrets_file}"
          printf 'STORAGE_ENCRYPTION_KEY=%s\n' "${STORAGE_ENCRYPTION_KEY}" >> "${secrets_file}"
          printf 'OMNIROUTE_WS_BRIDGE_SECRET=%s\n' "${OMNIROUTE_WS_BRIDGE_SECRET}" >> "${secrets_file}"
          chmod 600 "${secrets_file}"
          printf 'OMNIROUTE_WORKER_SECRETS_FILE=%s\n' "${secrets_file}" >> "${GITHUB_ENV}"

      - name: Deploy Worker and Container
        run: npx wrangler deploy --config wrangler.jsonc --secrets-file "${OMNIROUTE_WORKER_SECRETS_FILE}"

      - name: Report Container deployment status
        run: npx wrangler containers list

      - name: Remove temporary staging Worker secrets file
        if: ${{ always() }}
        shell: bash
        run: rm -f "${RUNNER_TEMP}/omniroute-staging-worker-secrets.env"
