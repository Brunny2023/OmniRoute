name: Cloudflare staging

on:
  push:
    branches:
      - cloudflare-staging
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-staging
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy staging gateway
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: staging
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Install deployment dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Validate Worker configuration
        run: npx wrangler deploy --config wrangler.jsonc --dry-run

      - name: Deploy Worker and Container
        run: npx wrangler deploy --config wrangler.jsonc

      - name: Report Container deployment status
        run: npx wrangler containers list
