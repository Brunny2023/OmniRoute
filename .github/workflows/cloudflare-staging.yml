name: Cloudflare staging

on:
  push:
    branches:
      - cloudflare-staging
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-staging
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy staging gateway
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: staging
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Install deployment dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Validate Worker configuration
        run: npx wrangler deploy --config wrangler.jsonc --dry-run

      - name: Create temporary staging Worker secrets file
        shell: bash
        env:
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          API_KEY_SECRET: ${{ secrets.API_KEY_SECRET }}
          INITIAL_PASSWORD: ${{ secrets.INITIAL_PASSWORD }}
          STORAGE_ENCRYPTION_KEY: ${{ secrets.STORAGE_ENCRYPTION_KEY }}
          OMNIROUTE_WS_BRIDGE_SECRET: ${{ secrets.OMNIROUTE_WS_BRIDGE_SECRET }}
        run: |
          set -euo pipefail
          for secret_name in JWT_SECRET API_KEY_SECRET INITIAL_PASSWORD STORAGE_ENCRYPTION_KEY OMNIROUTE_WS_BRIDGE_SECRET; do
            if [[ -z "${!secret_name:-}" ]]; then
              echo "::error::Required staging deployment secret ${secret_name} is unavailable."
              exit 1
            fi
          done

          secrets_file="${RUNNER_TEMP}/omniroute-staging-worker-secrets.env"
          umask 077
          : > "${secrets_file}"
          printf 'JWT_SECRET=%s\n' "${JWT_SECRET}" >> "${secrets_file}"
          printf 'API_KEY_SECRET=%s\n' "${API_KEY_SECRET}" >> "${secrets_file}"
          printf 'INITIAL_PASSWORD=%s\n' "${INITIAL_PASSWORD}" >> "${secrets_file}"
          printf 'STORAGE_ENCRYPTION_KEY=%s\n' "${STORAGE_ENCRYPTION_KEY}" >> "${secrets_file}"
          printf 'OMNIROUTE_WS_BRIDGE_SECRET=%s\n' "${OMNIROUTE_WS_BRIDGE_SECRET}" >> "${secrets_file}"
          chmod 600 "${secrets_file}"
          printf 'OMNIROUTE_WORKER_SECRETS_FILE=%s\n' "${secrets_file}" >> "${GITHUB_ENV}"

      - name: Deploy Worker and Container
        run: npx wrangler deploy --config wrangler.jsonc --secrets-file "${OMNIROUTE_WORKER_SECRETS_FILE}"

      - name: Report Container deployment status
        run: npx wrangler containers list

      - name: Remove temporary staging Worker secrets file
        if: ${{ always() }}
        shell: bash
        run: rm -f "${RUNNER_TEMP}/omniroute-staging-worker-secrets.env"
